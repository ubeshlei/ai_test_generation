name: Auto-generate unit tests with Copilot
on:
  push:
    branches:
      - main

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    environment: dev   # your environment
    steps:
      # ===============================
      # 1️⃣ Checkout the repository
      # ===============================
      - uses: actions/checkout@v3

      # ===============================
      # 2️⃣ Set up Java
      # ===============================
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'   # Required
          java-version: '17'

      # ===============================
      # 3️⃣ Install GitHub CLI and Copilot CLI
      # ===============================
      - name: Install GitHub CLI
        run: sudo apt update && sudo apt install -y gh

      - name: Install GitHub Copilot CLI extension
        run: gh extension install github/copilot-cli

      # ===============================
      # 4️⃣ Authenticate GitHub CLI using github.token
      # ===============================
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}  # automatic token provided by GitHub Actions
        run: gh auth login --with-token <<< "$GH_TOKEN"

      # ===============================
      # 5️⃣ Generate list of changed files
      # ===============================
      - name: Generate diff files
        run: |
          git fetch origin development
          git diff --name-only origin/development..HEAD > diff_files.txt
          echo "Changed files:"
          cat diff_files.txt

      # ===============================
      # 6️⃣ Generate JUnit tests using Copilot CLI
      # ===============================
      - name: Generate unit tests with Copilot
        run: |
          if [ ! -s diff_files.txt ]; then
            echo "No changed files detected. Skipping test generation."
            exit 0
          fi

          while read file; do
            if [[ $file == src/main/java/*.java ]]; then
              test_file="src/test/java/${file#src/main/java/}Test.java"
              mkdir -p "$(dirname $test_file)"
              echo "Generating test for $file -> $test_file"
              gh copilot generate --file "$file" --output "$test_file" --prompt "Generate JUnit 5 tests for this Java class"
            fi
          done < diff_files.txt

      # ===============================
      # 7️⃣ Commit generated tests and create PR
      # ===============================
      - name: Commit and create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b auto/unit-tests
          git add src/test/java
          if git diff --cached --quiet; then
            echo "No new tests generated. Skipping commit and PR."
            exit 0
          fi
          git commit -m "Auto-generate unit tests via Copilot"
          git push --set-upstream origin auto/unit-tests
          gh pr create \
            --title "Auto-generated unit tests" \
            --body "JUnit 5 tests generated automatically by Copilot CLI" \
            --base development \
            --head auto/unit-tests
