name: Auto-generate unit tests with Copilot
on:
  push:
    branches:
      - main

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    environment: dev   # your environment
    steps:
      # ===============================
      #  Checkout the repository
      # ===============================
      - uses: actions/checkout@v3

      # ===============================
      #  Set up Java
      # ===============================
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      # ===============================
      #  Install GitHub CLI and Copilot CLI
      # ===============================
      - name: Install GitHub CLI & Copilot CLI
        run: |
          sudo apt update
          sudo apt install -y gh
          # Install Copilot CLI
          curl -sSL https://github.com/github/copilot-cli/releases/latest/download/copilot-linux-amd64.tar.gz | tar xz -C /usr/local/bin

      # ===============================
      #  Authenticate GitHub CLI
      # ===============================
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token

      # ===============================
      #  Generate list of changed files
      # ===============================
      - name: Generate diff files
        run: |
          git fetch origin development
          git diff --name-only origin/development..HEAD > diff_files.txt
          echo "Changed files:"
          cat diff_files.txt

      # ===============================
      #  Generate JUnit tests using Copilot CLI
      # ===============================
      - name: Generate unit tests with Copilot
        run: |
          if [ ! -s diff_files.txt ]; then
            echo "No changed files detected. Skipping test generation."
            exit 0
          fi

          while read file; do
            if [[ $file == src/main/java/*.java ]]; then
              test_file="src/test/java/${file#src/main/java/}Test.java"
              mkdir -p "$(dirname $test_file)"
              echo "Generating test for $file -> $test_file"
              copilot generate --file "$file" --output "$test_file" --prompt "Generate JUnit 5 tests for this Java class"
            fi
          done < diff_files.txt

      # ===============================
      # 7️⃣ Commit generated tests and create PR
      # ===============================
      - name: Commit and create pull request
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b auto/unit-tests
          git add src/test/java
          if git diff --cached --quiet; then
            echo "No new tests generated. Skipping commit and PR."
            exit 0
          fi
          git commit -m "Auto-generate unit tests via Copilot"
          git push --set-upstream origin auto/unit-tests
          gh pr create \
            --title "Auto-generated unit tests" \
            --body "JUnit 5 tests generated automatically by Copilot CLI" \
            --base development \
            --head auto/unit-tests
