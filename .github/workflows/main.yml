name: AI Test Generation

on:
  pull_request:

jobs:
  generate-tests:
    runs-on: ubuntu-latest   # GitHub-hosted runner
    steps:
      # 1️⃣ get repo code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ install python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ install python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      # 4️⃣ get changed files
      - name: Get changed files
        run: |
          # get last change from main branch
          git fetch origin main --depth=2
          
          # do diff between main and current commit
          git diff --name-only origin/main $GITHUB_SHA > diff_files.txt
          
          # list to check
          cat diff_files.txt

      # 5️⃣ run python script
      - name: Run AI test generator
        env:
          dev: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python python_tools/generate_tests.py

      # 6️⃣ run tests local
      - name: Compile and run tests
        run: |
          mvn test

