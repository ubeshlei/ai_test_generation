name: Auto-generate unit tests with Copilot
on:
  push:
    branches:
      - main

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Set up Node.js for Copilot CLI
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 4️⃣ Install Copilot CLI via npm
      - name: Install Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }} # Personal Access Token with Copilot access
        run: npm install -g @githubnext/copilot-cli

      # 5️⃣ Generate list of changed files
      - name: Generate diff files
        run: |
          git fetch origin development
          git diff --name-only origin/development..HEAD > diff_files.txt
          echo "Changed files:"
          cat diff_files.txt

      # 6️⃣ Generate JUnit tests using Copilot CLI
      - name: Generate unit tests with Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          if [ ! -s diff_files.txt ]; then
            echo "No changed files detected. Skipping test generation."
            exit 0
          fi

          TEST_COUNT=0
          while read file; do
            if [[ $file == src/main/java/*.java ]]; then
              test_file="src/test/java/${file#src/main/java/}Test.java"
              mkdir -p "$(dirname $test_file)"
              echo "Generating test for $file -> $test_file"
              copilot generate --file "$file" --output "$test_file" --prompt "Generate JUnit 5 tests for this Java class"
              if [ -s "$test_file" ]; then
                ((TEST_COUNT++))
                echo "✅ Test generated: $test_file"
              fi
            fi
          done < diff_files.txt

          echo "========================================"
          echo "Summary: $TEST_COUNT test(s) generated."
          echo "========================================"

      # 7️⃣ Commit generated tests and create PR
      - name: Commit and create pull request
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b auto/unit-tests
          git add src/test/java
          if git diff --cached --quiet; then
            echo "No new tests generated. Skipping commit and PR."
            exit 0
          fi
          git commit -m "Auto-generate unit tests via Copilot"
          git push --set-upstream origin auto/unit-tests
          gh pr create \
            --title "Auto-generated unit tests" \
            --body "JUnit 5 tests generated automatically by Copilot CLI" \
            --base development \
            --head auto/unit-tests
